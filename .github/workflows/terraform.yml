name: terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [quickstart, envs/dev, envs/staging, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/${{ matrix.dir }} init -backend=false
      - run: terraform -chdir=infra/${{ matrix.dir }} fmt -check
      - run: terraform -chdir=infra/${{ matrix.dir }} validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # the runner has a Docker daemon, so the docker provider can plan
      - run: terraform -chdir=infra/envs/${{ matrix.env }} init
      - run: terraform -chdir=infra/envs/${{ matrix.env }} plan -no-color -var-file=${{ matrix.env }}.tfvars -out=tfplan
      - run: terraform -chdir=infra/envs/${{ matrix.env }} show -no-color tfplan > plan-${{ matrix.env }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.env }}
          path: plan-${{ matrix.env }}.txt
      # no apply here: apply only runs after merge

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
