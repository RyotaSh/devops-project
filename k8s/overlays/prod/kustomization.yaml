apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
replicas:
  - name: myapp
    count: 5
images:
  - name: ghcr.io/ryotash/devops-project
    newTag: "5c777c39a6d8de96225c2712399fdf7ab200033a"
labels:
  - pairs:
      env: prod
    includeSelectors: false
configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
