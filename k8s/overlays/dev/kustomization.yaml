apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
replicas:
  - name: myapp
    count: 1
images:
  - name: ghcr.io/ryotash/devops-project
    newTag: "7ac3693a370fd81b6009db804fb55125dd551ff5"
labels:
  - pairs:
      env: dev
    includeSelectors: false
configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - APP_ENV=dev
